[package]
name = "omegavault-cardano-pallas-readonly"
version = "0.1.0"
edition = "2021"
publish = false

# Pin the exact native Cardano parsing / ledger validation packages.
# A validated supply-chain build (lockfile and binary SHA-256) is required
# before an engine can ever be used for an authorization decision.
[dependencies]
pallas-codec = "=1.4.0"
pallas-primitives = "=1.4.0"
pallas-crypto = "=1.4.0"
pallas-addresses = "=1.4.0"
pallas-traverse = "=1.4.0"
pallas-validate = "=1.4.0"
hex = "=0.4.3"
sha2 = "=0.10.9"
serde_json = "=1.0.145"
chrono = "=0.4.42"

[profile.release]
overflow-checks = true
