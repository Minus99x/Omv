name: OmegaVault 0.6.51 Checkpoint Candidate

on:
  push:
    branches:
      - dev/0.6.51-checkpoint-candidate

permissions:
  contents: read

concurrency:
  group: omegavault-0.6.51-checkpoint-candidate
  cancel-in-progress: true

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHECKPOINT_DIR: /tmp/omegavault-0.6.51

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22.12
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Verify candidate version
        run: node -e "const p=require('./package.json'); if(p.version!=='0.6.51-dev') process.exit(2);"

      - name: Focused review audit suite
        run: npm run test:review-audit

      - name: Focused Stellar recovery suite
        run: npm run test:stellar-recovery

      - name: Focused Bitcoin recovery suite
        run: npm run test:bitcoin-recovery

      - name: Focused maturity/provenance suite
        run: npm run test:maturity-reconciliation

      - name: Focused Cardano toolchain/evidence suite
        run: npm run test:cardano-toolchain

      - name: Full test suite
        run: npm test

      - name: Offline resume verification
        run: npm run verify:offline-resume

      - name: Global checks
        run: npm run check

      - name: Build deterministic source archive
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import fnmatch
          import os
          import zipfile

          root = Path('.').resolve()
          output = Path(os.environ['CHECKPOINT_DIR']).resolve()
          output.mkdir(parents=True, exist_ok=True)
          archive = output / 'omegavault-mvp-0.6.51-dev.zip'

          def excluded(rel):
              text = rel.as_posix()
              parts = rel.parts
              if parts and parts[0] in {'.git', 'node_modules'}:
                  return True
              if rel.name in {'.DS_Store', 'Thumbs.db'}:
                  return True
              if fnmatch.fnmatch(text, 'omegavault-mvp-*.zip'):
                  return True
              if fnmatch.fnmatch(text, '*.checkpoint-manifest.json'):
                  return True
              return False

          files = sorted(
              p for p in root.rglob('*')
              if p.is_file() and not excluded(p.relative_to(root))
          )

          with zipfile.ZipFile(archive, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for path in files:
                  rel = path.relative_to(root).as_posix()
                  info = zipfile.ZipInfo(rel)
                  info.date_time = (1980, 1, 1, 0, 0, 0)
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  zf.writestr(info, path.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          print(f'archived {len(files)} source files')
          PY

      - name: Generate checkpoint and review bindings
        shell: bash
        run: |
          ARCHIVE_NAME="omegavault-mvp-0.6.51-dev.zip"
          ARCHIVE="$CHECKPOINT_DIR/$ARCHIVE_NAME"
          MANIFEST="$CHECKPOINT_DIR/omegavault-mvp-0.6.51-dev.checkpoint-manifest.json"
          INDEX="$CHECKPOINT_DIR/omegavault-mvp-0.6.51-dev.review-index.json"
          SUMS="$CHECKPOINT_DIR/omegavault-mvp-0.6.51-dev.SHA256SUMS"
          ARCHIVE_SHA="$(sha256sum "$ARCHIVE" | awk '{print $1}')"

          node scripts/generate-checkpoint-manifest.js --ref 0.6.51-dev --archive "$ARCHIVE_NAME" --archive-sha256 "$ARCHIVE_SHA" --output "$MANIFEST"
          node scripts/generate-external-review-index.js --archive "$ARCHIVE" --checkpoint-manifest "$MANIFEST" --output "$INDEX"
          node scripts/verify-external-review-index.js --index "$INDEX" --archive "$ARCHIVE" --checkpoint-manifest "$MANIFEST"
          sha256sum "$ARCHIVE" "$MANIFEST" "$INDEX" > "$SUMS"

      - name: Upload checkpoint candidate
        uses: actions/upload-artifact@v4
        with:
          name: omegavault-0.6.51-dev-candidate
          if-no-files-found: error
          retention-days: 30
          path: |
            /tmp/omegavault-0.6.51/omegavault-mvp-0.6.51-dev.zip
            /tmp/omegavault-0.6.51/omegavault-mvp-0.6.51-dev.checkpoint-manifest.json
            /tmp/omegavault-0.6.51/omegavault-mvp-0.6.51-dev.review-index.json
            /tmp/omegavault-0.6.51/omegavault-mvp-0.6.51-dev.SHA256SUMS
