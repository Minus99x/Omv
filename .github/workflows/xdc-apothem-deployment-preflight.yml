name: XDC Apothem pinned-contract deployment preflight
on:
  push:
    branches:
      - dev/0.6.60-reconcile-overnight-bitcoin
    paths:
      - .github/workflows/xdc-apothem-deployment-preflight.yml
permissions:
  contents: read
jobs:
  read-only-solidity-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install project's pinned dependencies
        run: npm ci --ignore-scripts
      - name: Validate constructor policy and non-deployment boundaries
        run: |
          node --check src/chains/evm/apothem-deployment-budget.js
          node --check scripts/xdc-apothem-deployment-preflight.js
          node --test test/xdc-apothem-deployment-budget.test.js
      - name: Compile OmegaVault 0.5 with pinned solc and query two Apothem RPCs
        run: node scripts/xdc-apothem-deployment-preflight.js
