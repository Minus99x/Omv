name: XDC chain-51 isolated EVM recovery rehearsal
on:
  push:
    branches:
      - dev/0.6.60-reconcile-overnight-bitcoin
    paths:
      - .github/workflows/xdc-apothem-local-rehearsal.yml
permissions:
  contents: read
jobs:
  disposable-local-evm:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install project and isolated pinned rehearsal dependencies
        run: |
          npm ci --ignore-scripts
          npm install --no-save --package-lock=false --ignore-scripts ethers@6.13.4 ganache@7.9.2
      - name: Verify rehearsal syntax without connecting to a public network
        run: node --check scripts/xdc-apothem-local-recovery-rehearsal.js
      - name: Execute real contract logic locally with guardian heartbeat and mock XRC-20 sweep
        run: node scripts/xdc-apothem-local-recovery-rehearsal.js
