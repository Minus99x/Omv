name: OmegaVault Dev Verification

on:
  push:
    branches:
      - 'dev/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omegavault-dev-verification-v2
  cancel-in-progress: true

jobs:
  # Independent category checks keep unrelated chains visible if the main
  # sequential verification job stops early on a Scalus or toolchain failure.
  # No 'needs' dependencies: failures are not masked with continue-on-error.
  cardano-scalus-independent:
    name: Cardano genuine Scalus 1.3.0 regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - name: Install isolated Scalus emulator
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund scalus@1.3.0
      - name: Run genuine offline Cardano Scalus tests
        run: npm run test:cardano:scalus

  bitcoin-independent:
    name: Bitcoin recovery regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - name: Verify Bitcoin recovery and Signet workflows
        run: |
          npm run test:bitcoin-recovery
          npm run test:bitcoin-native
          npm run test:bitcoin-signet-cli

  stellar-independent:
    name: Stellar recovery regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - name: Verify Stellar native and recovery workflows
        run: |
          npm run test:stellar-recovery
          npm run test:stellar-native

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22.12
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      # Opt-in development verification only: real Scalus 1.3.0 code executes here.
      # Never signs, submits, uses real credentials, or asserts public Preprod proof.
      # Keep it outside the production dependency lockfile.
      - name: Install pinned real Scalus emulator for offline ledger tests
        run: |
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund scalus@1.3.0
          npm ls scalus --depth=0

      - name: Run actual Scalus offline Cardano ledger regression
        run: npm run test:cardano:scalus

      - name: Focused review audit suite
        run: npm run test:review-audit

      - name: Focused Stellar recovery suite
        run: npm run test:stellar-recovery

      - name: Focused Stellar native suite
        run: npm run test:stellar-native

      - name: Focused Bitcoin recovery suite
        run: npm run test:bitcoin-recovery

      - name: Focused Bitcoin native suite
        run: npm run test:bitcoin-native

      - name: Focused maturity/provenance suite
        run: npm run test:maturity-reconciliation

      - name: Core invariant and support release gate
        run: npm run test:core-invariants

      - name: Focused Cardano toolchain/evidence suite
        run: npm run test:cardano-toolchain

      - name: Focused Cardano maturity/provenance reconciliation
        run: npm run test:cardano-reconciliation

      - name: Focused Cardano Preprod evidence harness
        run: npm run test:cardano-preprod-evidence

      - name: Focused Cardano Preprod capture session/manifest
        run: npm run test:cardano-preprod-session

      - name: Focused Cardano Preprod invariant evidence program
        run: npm run test:cardano-preprod-invariants

      - name: Focused Cardano Preprod four-action campaign
        run: npm run test:cardano-preprod-campaign

      - name: Focused Cardano workstation launch gate
        run: npm run test:cardano-workstation-launch

      - name: Focused Cardano campaign workstation launch gate
        run: npm run test:cardano-campaign-workstation-launch

      # This is a public-source provenance check, NOT a current ledger or
      # transaction-phase-one proof. It needs no keys or workstation files.
      - name: Verify official Preprod genesis byte hashes and timing
        run: node scripts/verify-cardano-preprod-public-genesis.js
        timeout-minutes: 2

      - name: Full test suite
        run: npm test

      - name: Offline resume verification
        run: npm run verify:offline-resume

      - name: Global checks
        run: npm run check
