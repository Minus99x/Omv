name: OmegaVault Dev Verification

on:
  push:
    branches:
      - 'dev/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: omegavault-dev-verification-v2
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22.12
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm

      - name: Install pinned dependencies
        run: npm ci

      - name: Focused review audit suite
        run: npm run test:review-audit

      - name: Focused Stellar recovery suite
        run: npm run test:stellar-recovery

      - name: Focused Bitcoin recovery suite
        run: npm run test:bitcoin-recovery

      - name: Focused maturity/provenance suite
        run: npm run test:maturity-reconciliation

      - name: Focused Cardano toolchain/evidence suite
        run: npm run test:cardano-toolchain

      - name: Focused Cardano maturity/provenance reconciliation
        run: npm run test:cardano-reconciliation

      - name: Focused Cardano Preprod evidence harness
        run: npm run test:cardano-preprod-evidence

      - name: Full test suite
        run: npm test

      - name: Offline resume verification
        run: npm run verify:offline-resume

      - name: Global checks
        run: npm run check
