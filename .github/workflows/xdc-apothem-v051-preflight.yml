name: XDC V0.5.1 corrected candidate live read-only gas proof
on:
  push:
    branches:
      - dev/0.6.60-reconcile-overnight-bitcoin
    paths:
      - .github/workflows/xdc-apothem-v051-preflight.yml
permissions:
  contents: read
jobs:
  corrected-candidate-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Validate fixed source selection and testnet-only boundaries
        run: |
          node --check scripts/xdc-apothem-deployment-preflight.js
          node --check scripts/xdc-apothem-v051-deployment-preflight.js
          node --test test/xdc-apothem-deployment-budget.test.js test/xdc-apothem-v051-source-selection.test.js
      - name: Compile corrected V0.5.1, independently estimate creation on both live Apothem RPCs
        run: node scripts/xdc-apothem-v051-deployment-preflight.js
