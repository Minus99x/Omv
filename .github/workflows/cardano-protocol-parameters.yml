name: Cardano protocol parameter regression tests

on:
  push:
    branches:
      - dev/0.6.60-reconcile-overnight-bitcoin
    paths:
      - 'src/chains/cardano/protocol-parameters.js'
      - 'src/chains/cardano/live-protocol-parameters.js'
      - 'test/cardano-protocol-parameters.test.js'
      - 'test/cardano-live-protocol-parameters.test.js'
      - 'docs/evidence/CARDANO_PREPROD_PROTOCOL_PARAMETERS_EPOCH_316.json'
      - '.github/workflows/cardano-protocol-parameters.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cardano-protocol-parameters:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check src/chains/cardano/protocol-parameters.js && node --check src/chains/cardano/live-protocol-parameters.js && node --check test/cardano-protocol-parameters.test.js && node --check test/cardano-live-protocol-parameters.test.js
      - name: Focused regression tests
        run: node --test test/cardano-protocol-parameters.test.js test/cardano-live-protocol-parameters.test.js
