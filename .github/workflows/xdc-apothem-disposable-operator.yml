name: XDC disposable public-Testnet operator-package offline gates
on:
  push:
    branches:
      - dev/0.6.60-reconcile-overnight-bitcoin
    paths:
      - .github/workflows/xdc-apothem-disposable-operator.yml
permissions:
  contents: read
jobs:
  operator-package:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install project dependencies and isolated pinned disposable signer
        run: |
          npm ci --ignore-scripts
          npm install --no-save --package-lock=false --ignore-scripts ethers@6.13.4
      - name: Check offline signer, trial runner, and hard execution boundary
        run: |
          node --check src/chains/evm/apothem-public-trial-guard.js
          node --check scripts/xdc-apothem-disposable-wallet.js
          node --check scripts/xdc-apothem-disposable-live.js
          node --check scripts/xdc-apothem-disposable-operator-checks.mjs
      - name: Prove encryption, public-only funding reads, fail-closed chain/fee and key gating
        run: |
          node --test test/xdc-apothem-public-trial-guard.test.js scripts/xdc-apothem-disposable-operator-checks.mjs
      - name: Prove live execution stays disabled in CI
        run: |
          node scripts/xdc-apothem-disposable-live.js 2> trial-denied.txt && exit 1 || grep -q "trial is OFF" trial-denied.txt
