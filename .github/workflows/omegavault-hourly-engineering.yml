name: OmegaVault Frequent AI Engineering Launcher

# Default branch hosts only the trigger. All AI work and Git writes target
# dev/0.6.60-reconcile-overnight-bitcoin. No production code is modified.
on:
  schedule:
    # Four distinct engineering opportunities per hour at :11, :26, :41, :56 UTC
    # (Arizona time is UTC-7 year-round); GitHub may delay scheduled starts.
    # Each run commits only a real source/test improvement that passes verification.
    - cron: '11,26,41,56 * * * *'
  workflow_dispatch:
  # Explicit self-test: commits changing only this launcher also exercise the current worker.
  # A push event is recorded as push, NEVER as proof of an hourly schedule trigger.
  push:
    branches: [main]
    paths:
      - '.github/workflows/omegavault-hourly-engineering.yml'

permissions:
  contents: read

concurrency:
  group: omegavault-main-cron-single-worker
  cancel-in-progress: false
  queue: max

jobs:
  trigger-receipt:
    name: Record actual GitHub trigger
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Record trigger receipt
        env:
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os
          receipt = {key.lower(): os.environ[key] for key in
                     ('EVENT_NAME', 'EVENT_SCHEDULE', 'RUN_ID', 'RUN_ATTEMPT', 'SOURCE_SHA', 'SOURCE_REF',
                      'ACTOR', 'ACTOR_ID', 'TRIGGERING_ACTOR', 'WORKFLOW_REF', 'RUN_URL')}
          receipt['chat_attribution'] = 'unavailable: GitHub does not authenticate a ChatGPT conversation ID'
          receipt['observed_at_utc'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          payload = json.dumps(receipt, indent=2)
          print(payload)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## GitHub trigger receipt\n\n```json\n' + payload + '\n```\n')
          PY

  verify-worker-controls:
    name: Verify pinned worker guard regressions
    needs: trigger-receipt
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 50a12acb183e6b2ea83bf4c2eaab46b89fa3fd59
          persist-credentials: false
      - run: python3 .github/tests/test_worker_controls.py

  autonomous-engineering:
    name: Trigger isolated AI worker on scheduler-only branch
    needs: verify-worker-controls
    uses: Minus99x/Omv/.github/workflows/omegavault-hourly-engineering.yml@50a12acb183e6b2ea83bf4c2eaab46b89fa3fd59
    permissions:
      contents: write
      copilot-requests: write
