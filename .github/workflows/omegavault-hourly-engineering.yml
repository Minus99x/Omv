name: OmegaVault Frequent AI Engineering Launcher

# Default branch hosts only the trigger. All AI work and Git writes target
# dev/0.6.60-reconcile-overnight-bitcoin. No production code is modified.
on:
  schedule:
    # Three unattended engineering runs per hour, at :07, :27, :47 Arizona.
    - cron: '7-47/20 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/omegavault-hourly-engineering.yml'

permissions:
  contents: read

concurrency:
  group: omegavault-main-cron-single-worker
  cancel-in-progress: false

jobs:
  trigger-receipt:
    name: Record actual GitHub trigger
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Record trigger receipt
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, json, os
          receipt = {key.lower(): os.environ[key] for key in
                     ('EVENT_NAME', 'EVENT_SCHEDULE', 'RUN_ID', 'RUN_ATTEMPT', 'SOURCE_SHA', 'SOURCE_REF')}
          receipt['observed_at_utc'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          payload = json.dumps(receipt, indent=2)
          print(payload)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## GitHub trigger receipt\n\n```json\n' + payload + '\n```\n')
          PY

  autonomous-engineering:
    name: Trigger isolated AI worker on scheduler-only branch
    needs: trigger-receipt
    uses: Minus99x/Omegavault/.github/workflows/omegavault-hourly-engineering.yml@automation/omegavault-hourly
    permissions:
      contents: write
      copilot-requests: write
