name: XDC Apothem independent two-provider RPC comparison
on:
  push:
    branches:
      - dev/0.6.60-reconcile-overnight-bitcoin
    paths:
      - .github/workflows/xdc-apothem-readonly-proof.yml
permissions:
  contents: read
jobs:
  xdc-readonly-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Validate read-only network proof implementation
        run: node --check scripts/xdc-apothem-readonly-probe.js && node --test test/xdc-apothem-readonly-probe.test.js
      - name: Query real Apothem network without wallets or transaction submission
        run: node scripts/xdc-apothem-readonly-probe.js
      - name: Validate independent same-height and gas comparison
        run: node --check scripts/xdc-apothem-independent-rpc-check.js && node --test test/xdc-apothem-independent-rpc-check.test.js
      - name: Cross-check two independent Apothem providers on the live chain
        run: node scripts/xdc-apothem-independent-rpc-check.js
