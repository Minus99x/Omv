name: Stellar disposable Testnet recovery proof
on:
  push:
    branches:
      - dev/0.6.60-reconcile-overnight-bitcoin
    paths:
      - .github/workflows/stellar-disposable-testnet-proof.yml
permissions:
  contents: read
jobs:
  disposable-testnet-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMEGAVAULT_STELLAR_DISPOSABLE_TESTNET: DISPOSABLE_FAKE_XLM_ONLY
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Verify opt-in boundary before any live action
        run: node --test test/stellar-testnet-live-disposable-recovery.test.js
      - name: Execute disposable native recovery on public Stellar Testnet
        run: node scripts/stellar-testnet-live-disposable-recovery.js
