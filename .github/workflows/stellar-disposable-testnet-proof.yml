name: Stellar issued-token 2-of-2 sponsored recovery proof
on:
  push:
    branches:
      - dev/0.6.60-reconcile-overnight-bitcoin
    paths:
      - .github/workflows/stellar-disposable-testnet-proof.yml
permissions:
  contents: read
jobs:
  disposable-testnet-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMEGAVAULT_STELLAR_DISPOSABLE_TESTNET: DISPOSABLE_FAKE_XLM_ONLY
      OMEGAVAULT_STELLAR_DISPOSABLE_CONTACTS: '2'
      OMEGAVAULT_STELLAR_DISPOSABLE_SPONSOR: SPONSORED_FAKE_XLM_ONLY
      OMEGAVAULT_STELLAR_DISPOSABLE_ASSET: EPHEMERAL_CLASSIC_ASSET
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts
      - name: Verify opt-in boundary before any live action
        run: node --test test/stellar-testnet-live-disposable-recovery.test.js
      - name: Validate live proof source syntax
        run: node --check scripts/stellar-testnet-live-disposable-recovery.js
      # Real Testnet only; freshly generated disposable guardian identities.
      # Verify returned canonical on-ledger fee-bump XDR, not only Horizon metadata.
      # Native min-sequence-age failures are tx_bad_minseq_age_or_gap, not txTOO_EARLY.
      - name: Prove owner heartbeat, native 2-of-2 recovery and real sponsor fee payment
        run: node scripts/stellar-testnet-live-disposable-recovery.js
